autoDedupe: true

autoInstallPeers: false

color: always

engineStrict: true

gitChecks: false

minimumReleaseAgeExclude:
  - '@standard-config/*'

overrides:
  vite-plus>oxfmt: '-'
  vite-plus>oxlint: latest
  vite-plus>oxlint-tsgolint: latest
  vite: npm:@voidzero-dev/vite-plus-core@latest

peerDependencyRules:
  ignoreMissing:
    - eslint
    - vitest

strictPeerDependencies: true

trustPolicy: no-downgrade
